name: CI

on:
  push:
    branches: [ main, v1 ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Covers every .go file in the repository, including the nested
      # example modules.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' and commit the result."
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      # Includes examples/basic, examples/gcloud and examples/gh, which are
      # packages of the root module.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Includes TestDocsCompile and TestDocsLinks (docs_test.go), which
      # compile the Go code blocks of every Markdown file against the
      # working tree and check relative links.
      - name: Test
        run: go test -race ./...

  lint:
    name: Lint (root module)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The root module has no findings, so the whole module is linted on
      # every run, and any finding fails the job. Both limits are off so the
      # log lists every finding, not the first 50 per linter.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --max-issues-per-linter=0 --max-same-issues=0

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Examples with their own go.mod. Each one replaces
        # github.com/SCKelemen/clix/v2 with the working tree (../..).
        example: [ bubbles, lipgloss, multicli, protoschema, survey ]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: examples/${{ matrix.example }}/go.sum

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  completion:
    name: Shell completion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shells whose absence fails the tests instead of skipping them
          # (see requireEnv in ext/autocomplete/shells_test.go). pwsh is
          # added when the runner image has it.
          - os: ubuntu-latest
            shells: bash5,bash-completion,zsh,fish
          - os: macos-latest
            shells: bash32,bash5,bash-completion,zsh,fish
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/apt-install.sh bash bash-completion zsh fish

      # macOS keeps /bin/bash 3.2 and /bin/zsh; Homebrew adds bash 5.
      - name: Install shells (macOS)
        if: runner.os == 'macOS'
        run: brew install bash bash-completion@2 zsh fish

      - name: Show shell versions
        id: shells
        shell: bash
        run: |
          shells='${{ matrix.shells }}'
          for b in /bin/bash /usr/bin/bash /opt/homebrew/bin/bash "$(command -v bash)"; do
            [ -x "$b" ] && echo "$b: $("$b" -c 'echo $BASH_VERSION')"
          done
          zsh --version
          fish --version
          if command -v pwsh >/dev/null; then
            pwsh -NoLogo -NoProfile -Command '"pwsh " + $PSVersionTable.PSVersion'
            shells="$shells,pwsh"
          else
            echo "::warning::pwsh is not installed; skipping the PowerShell tests"
          fi
          echo "required=$shells" >> "$GITHUB_OUTPUT"

      # The TestShell_* tests drive the real shells (bash and zsh through a
      # pty); TestBug_* and TestSharp_* are the regression tests.
      - name: Test
        env:
          CLIX_COMPLETION_SHELLS: ${{ steps.shells.outputs.required }}
        run: go test -race -count=1 -timeout 20m -v -run 'TestShell|TestBug|TestSharp' ./ext/autocomplete/
