# golangci-lint configuration for the root module.
# Reference: https://golangci-lint.run/docs/configuration/file/
#
# This file intentionally keeps golangci-lint's defaults: the "standard"
# linter set (errcheck, govet, ineffassign, staticcheck, unused) with no
# exclusions or exclusion presets.
#
# The root module has no findings with golangci-lint v2.15.0 (the version
# pinned in .github/workflows/ci.yml), and CI lints the whole module on every
# run. Fix new findings in code rather than silencing them here.
version: "2"

linters:
  default: standard
